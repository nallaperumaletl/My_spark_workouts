version: '3'
services:
  pyspark-jupyter:
    image: easewithdata/pyspark-jupyter-lab-old
    container_name: pyspark-jupyter
    hostname: pyspark-jupyter
    ports:
      - "8888:8888"
      - "4040:4040"
    environment:
      JUPYTER_PORT: 8888
      SPARK_UI_PORT: 4040
      SPARK_LOCAL_HOSTNAME: pyspark-jupyter
    networks:
      spark_network:
        ipv4_address: 172.25.0.3
    volumes:
      - spark_data:/data:rw

  spark-master:
    image: bde2020/spark-master:3.3.0-hadoop3.3
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - INIT_DAEMON_STEP=setup_spark
    networks:
      spark_network:
        ipv4_address: 172.25.0.2
    volumes:
      - spark_data:/data:rw

  spark-worker-1:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-1
    hostname: spark-worker-1
    depends_on:
      - spark-master
    ports:
      - "8081:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      spark_network:
        ipv4_address: 172.25.0.4
    volumes:
      - spark_data:/data:rw

  spark-worker-2:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-2
    hostname: spark-worker-2
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      spark_network:
        ipv4_address: 172.25.0.5
    volumes:
      - spark_data:/data:rw

  spark-worker-3:
    image: bde2020/spark-worker:3.3.0-hadoop3.3
    container_name: spark-worker-3
    hostname: spark-worker-3
    depends_on:
      - spark-master
    ports:
      - "8083:8081"
    environment:
      - SPARK_MASTER=spark://spark-master:7077
    networks:
      spark_network:
        ipv4_address: 172.25.0.7
    volumes:
      - spark_data:/data:rw

  spark-history-server:
    image: bde2020/spark-history-server:3.3.0-hadoop3.3
    container_name: spark-history-server
    hostname: spark-history-server
    depends_on:
      - spark-master
    ports:
      - "18081:18081"
    networks:
      spark_network:
        ipv4_address: 172.25.0.6
    volumes:
      - /tmp/spark-events-local:/tmp/spark-events:rw

networks:
  spark_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/16

volumes:
  spark_data:

